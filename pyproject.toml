[project]
name = "aipme"
version = "0.1.0"
description = "Provision a Hetzner Cloud server, bootstrap Docker + Apache, and get push alerts when CPU or memory runs hot."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "protereus" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "rich>=14.0",
    "typer>=0.27",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Repository = "https://github.com/protereus/AIPME"

[project.scripts]
aipme = "aipme.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "responses>=0.26",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
